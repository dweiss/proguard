name: Renamer CI check
on:
  pull_request:
  push:
    branches:
      - renamer
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :proguard-app:check :base:check -x ktlintTestSourceSetCheck
